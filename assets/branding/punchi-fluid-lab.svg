<!--
  Punchi Fluid Lab application icon, cobalt dual-tone (Reversal icon-theme language).
  A pipe rises on the left, loops around a manometer as the bowl of the P and returns
  down the outlet leg; two collars and three chevrons mark the flow.
  Palette: plate #1B489E, rim #2D68C3, light #90C0F0, medium #2484CC.
  Geometry is plain shapes and gradients only: no filters, no style blocks, no
  external reference, so Inkscape, librsvg and a browser render the same picture.
-->
