#
# Compressor with an adjustable delivery: X11400 plus the adjustability arrow.
#
# The body is the compressor's: the outline triangle of a gas, its point at the delivery, the
# intake below (port 1) and the delivery above (port 2, RF052). X11400 prints no shaft bar;
# the previous record read one from another symbology, and the owner's 2026-11-25 correction
# removed it. The arrow is the one difference, and the standard fixes where it goes:
# on the **diameter** of the machine's circle (RF040), with a filled head, and it may be
# longer than the circle it crosses.
#
# A compressor alone is not a usable air line: the air it delivers is wet and its pressure
# wanders. The service unit (`preparation.service_unit`) is what makes it usable.

schema = 3
id = "supply.compressor_adjustable"
name = "Adjustable compressor, 4 bar"
name_es = "Compresor regulable, 4 bar"
category = "supply"
summary = "Makes the compressed air, with an adjustable delivery."

# The delivery, above: port 2.
[[port]]
id = "2"
role = "supply"
position = [0.64, 0.06]

# The intake, below: port 1, open to the atmosphere.
[[port]]
id = "1"
role = "exhaust"
position = [0.64, 0.858]

[behaviour]
type = "supply"
pressure_bar = 4.0

[[symbol]]
kind = "circle"
points = [0.64, 0.45, 0.28]

[[symbol]]
kind = "polygon"
points = [0.64, 0.17, 0.736, 0.334, 0.544, 0.334]
filled = false

[[symbol]]
kind = "line"
points = [0.64, 0.06, 0.64, 0.17]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.64, 0.73, 0.64, 0.858]
line_class = "working"

# The adjustability arrow: on the diameter, at 45°, from outside one side of the circle to
# outside the other, with the filled head at the upper end (RF040).
[[symbol]]
kind = "line"
points = [0.341, 0.749, 0.913, 0.177]
line_class = "working"

[[symbol]]
kind = "polygon"
points = [0.973, 0.118, 0.933, 0.197, 0.893, 0.157]
filled = true
