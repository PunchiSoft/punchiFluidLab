#
# Shuttle valve (OR), ISO 1219-1 X10740.
#
# The standard draws the functional unit frame with two opposed check seats and one
# ball between them, the outlet branching from a junction dot at the centre: the inlet
# that carries the higher pressure pushes the ball off its own seat and into the other,
# and the outlet follows it. The geometry below is read from the 2006 copy of
# ISO 1219-1 (6.1.5.5 and 7.1.5.5) and confirmed against JIS B 0125-1:2020.
#
# The catalogue keeps the ball as a moving part with the three positions of ADR 0041:
# the static seats and the dot are the standard's form, the motion is the simulator's
# state. Both inlets print `1` and keep distinct ids, so a pipe and the solver address
# each inlet without the numeral lying about which is which (ADR 0039).

schema = 3
id = "valve.shuttle"
name = "Shuttle valve (OR)"
name_es = "Válvula selectora (OR)"
category = "valve"
summary = "Selects the higher pressure from two supply inputs."

# --------------------------------------------------
# Main body: 8M x 4M of the standard's module, M = 2 mm.
# --------------------------------------------------

[[symbol]]
kind = "rect"
points = [0.10, 0.30, 0.80, 0.40]
line_class = "working"

# --------------------------------------------------
# The through path: the two inlets and the outlet meet at the centre dot.
# --------------------------------------------------

[[symbol]]
kind = "line"
points = [0.0, 0.50, 0.2175, 0.50]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.3175, 0.50, 1.0, 0.50]
line_class = "working"

# Outlet: the stub leaves the top edge at the centre and reaches the junction dot.
[[symbol]]
kind = "line"
points = [0.50, 0.0, 0.50, 0.50]
line_class = "working"

# --------------------------------------------------
# The two check seats and the ball between them.
# --------------------------------------------------

# Left seat: vertex on the left, opening towards the centre.
[[symbol]]
kind = "polyline"
points = [0.30, 0.391, 0.2195, 0.50, 0.30, 0.609]
line_class = "working"

# Right seat: vertex on the right, opening towards the centre.
[[symbol]]
kind = "polyline"
points = [0.654, 0.391, 0.805, 0.50, 0.654, 0.609]
line_class = "working"

# The ball: 1M diameter, seated on the left at rest.
[[symbol]]
kind = "circle"
points = [0.2675, 0.50, 0.05]
line_class = "working"

# Junction dot where the outlet branches from the through path (501V2).
[[symbol]]
kind = "circle"
points = [0.50, 0.50, 0.015]
filled = true
line_class = "working"

# The ball is primitive 6 (zero-based) and takes the left, centre and right seats of
# the live signal (ADR 0041).
[[moving]]
primitive = 6
seats = [[0.2675, 0.50], [0.50, 0.50], [0.7325, 0.50]]

# --------------------------------------------------
# Ports: two inlets printed `1`, distinct ids, one outlet `2`.
# --------------------------------------------------

[[port]]
id = "1a"
role = "supply"
position = [0.0, 0.50]
numeral = "1"

[[port]]
id = "1b"
role = "supply"
position = [1.0, 0.50]
numeral = "1"

[[port]]
id = "2"
role = "working"
position = [0.50, 0.0]
numeral = "2"

# --------------------------------------------------
# Behaviour
# --------------------------------------------------

[behaviour]
type = "pressure"
kind = "shuttle"
