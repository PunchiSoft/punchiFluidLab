#
# Shuttle valve (OR), ISO 1219-1 X10740.
#
# The standard draws the functional unit frame with two opposed check seats and one
# ball between them, the outlet branching from a junction dot at the centre: the inlet
# that carries the higher pressure pushes the ball off its own seat and into the other,
# and the outlet follows it. The geometry below is read from the 2006 copy of
# ISO 1219-1 (6.1.5.5 and 7.1.5.5) and confirmed against JIS B 0125-1:2020.
#
# The catalogue keeps the ball as a moving part with the three positions of ADR 0041:
# the static seats and the dot are the standard's form, the motion is the simulator's
# state. Both inlets print `1` and keep distinct ids, so a pipe and the solver address
# each inlet without the numeral lying about which is which (ADR 0039).
#
# The box is 25 x 17 mm: the 16 x 8 mm body and the 4.5 mm margins the port numerals
# need outside the body. A numeral never sits on the symbol; the owner's 2026-11-25 rule.
# The `frame` is the body's edge, the boundary the numerals are placed against.

schema = 3
id = "valve.shuttle"
name = "Shuttle valve (OR)"
name_es = "Válvula selectora (OR)"
category = "valve"
summary = "Selects the higher pressure from two supply inputs."
box = [25, 17]

# The body is the frame the numerals are placed outside of; it is a solid rectangle, so
# the frame is a datum and not a primitive's line class.
frame = [0.18, 0.2647, 0.82, 0.7353]

# --------------------------------------------------
# Main body: 8M x 4M of the standard's module, M = 2 mm.
# --------------------------------------------------

[[symbol]]
kind = "rect"
points = [0.18, 0.2647, 0.64, 0.4706]
line_class = "working"

# --------------------------------------------------
# The through path: one continuous line from inlet to inlet, so the ball and its seats
# never read as a break in the line. The junction dot is the outlet's branch.
# --------------------------------------------------

[[symbol]]
kind = "line"
points = [0.0, 0.50, 1.0, 0.50]
line_class = "working"

# Outlet: the stub leaves the top edge of the body at the centre and reaches the junction.
[[symbol]]
kind = "line"
points = [0.50, 0.0, 0.50, 0.50]
line_class = "working"

# --------------------------------------------------
# The two check seats and the ball between them.
# --------------------------------------------------

# Left seat: vertex on the left, opening towards the ball.
[[symbol]]
kind = "polyline"
points = [0.3636, 0.3718, 0.2756, 0.50, 0.3636, 0.6282]
line_class = "working"

# Right seat: the same V mirrored about the centre, vertex on the right.
[[symbol]]
kind = "polyline"
points = [0.6560, 0.3718, 0.7440, 0.50, 0.6560, 0.6282]
line_class = "working"

# The ball: 1M diameter, seated on the left at rest. Its centre is the tangent distance
# from the left seat's vertex (0.0569 in the box), so the circumference touches the two
# arms; the circle is unfilled, so the continuous through line reads through it instead
# of being cut by a canvas-filled disk.
[[symbol]]
kind = "circle"
points = [0.332456, 0.50, 0.0588]
line_class = "working"

# Junction dot where the outlet branches from the through path (501V2).
[[symbol]]
kind = "circle"
points = [0.50, 0.50, 0.0176]
filled = true
line_class = "working"

# The ball is primitive 5 (zero-based) and takes the left, centre and right seats of
# the live signal (ADR 0041). The two seats are equal; the right tangent centre is
# 0.0569 to the left of its vertex.
[[moving]]
primitive = 5
seats = [[0.332456, 0.50], [0.50, 0.50], [0.687140, 0.50]]

# --------------------------------------------------
# Ports: two inlets printed `1`, distinct ids, one outlet `2`.
# --------------------------------------------------

[[port]]
id = "1a"
role = "supply"
position = [0.0, 0.50]
numeral = "1"
numeral_side = "above"

[[port]]
id = "1b"
role = "supply"
position = [1.0, 0.50]
numeral = "1"
numeral_side = "above"

[[port]]
id = "2"
role = "working"
position = [0.50, 0.0]
numeral = "2"

# --------------------------------------------------
# Behaviour
# --------------------------------------------------

[behaviour]
type = "pressure"
kind = "shuttle"
