#
# Shuttle valve (OR)
# Geometric reconstruction from the supplied reference image.

schema = 3
id = "valve.shuttle"
name = "Shuttle valve (OR)"
name_es = "Válvula selectora (OR)"
category = "valve"
summary = "Selects the higher pressure from two supply inputs."

# --------------------------------------------------
# Main body
# --------------------------------------------------

[[symbol]]
kind = "rect"
points = [0.20, 0.25, 0.60, 0.50]
line_class = "working"

# --------------------------------------------------
# External connections
# --------------------------------------------------

# Left supply connection
[[symbol]]
kind = "line"
points = [0.0, 0.50, 0.20, 0.50]
line_class = "working"

# Right supply connection
[[symbol]]
kind = "line"
points = [0.80, 0.50, 1.0, 0.50]
line_class = "working"

# Upper outlet connection
[[symbol]]
kind = "line"
points = [0.50, 0.0, 0.50, 0.50]
line_class = "working"

# --------------------------------------------------
# Internal hydraulic mechanism
# --------------------------------------------------

# Left horizontal passage
[[symbol]]
kind = "line"
points = [0.20, 0.50, 0.283, 0.50]
line_class = "working"

# Left check valve seat
[[symbol]]
kind = "polyline"
points = [0.375, 0.40, 0.283, 0.50, 0.375, 0.60]
line_class = "working"

# Shuttle ball
[[symbol]]
kind = "circle"
points = [0.35, 0.50, 0.05]
line_class = "working"

# Passage from shuttle ball to central junction
[[symbol]]
kind = "line"
points = [0.283, 0.50, 0.50, 0.50]
line_class = "working"

# Central junction to right check valve
[[symbol]]
kind = "line"
points = [0.50, 0.50, 0.72, 0.50]
line_class = "working"

# Right check valve seat
[[symbol]]
kind = "polyline"
points = [0.63, 0.40, 0.72, 0.50, 0.63, 0.60]
line_class = "working"

# Passage from the right check to the body edge
[[symbol]]
kind = "line"
points = [0.72, 0.50, 0.80, 0.50]
line_class = "working"

# --------------------------------------------------
# Central junction
# --------------------------------------------------

[[symbol]]
kind = "circle"
points = [0.50, 0.50, 0.022]
filled = true
line_class = "working"

# The ball (primitive 6) is placed from the live state: left seat, centre, right seat
# (ADR 0041). 1A pushes it right, 1B left, and two live signals hold it centred.
[[moving]]
primitive = 6
seats = [[0.35, 0.50], [0.50, 0.50], [0.65, 0.50]]

# --------------------------------------------------
# Ports
# --------------------------------------------------

[[port]]
id = "1a"
role = "supply"
position = [0.0, 0.50]
numeral = "1"

[[port]]
id = "1b"
role = "supply"
position = [1.0, 0.50]
numeral = "1"

[[port]]
id = "2"
role = "working"
position = [0.50, 0.0]
numeral = "2"

# --------------------------------------------------
# Behaviour
# --------------------------------------------------

[behaviour]
type = "pressure"
kind = "shuttle"
