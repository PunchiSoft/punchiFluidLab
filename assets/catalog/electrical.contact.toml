#
# Push button, normally open: the simplest contact of a control circuit.
#
# Two terminals with a gap between them and a bar that closes it. The contact is a switch in
# the run: a click closes it and the next click opens it, and the state is not saved — a
# reopened circuit starts with the button at rest (ADR 0018).
#
# The symbol is drawn from the general convention: a fixed contact, a movable bar and the
# push rod that moves it, with the gap between the two terminals.

schema = 3
id = "electrical.contact"
name = "Push button, normally open"
name_es = "Pulsador, abierto en reposo"
category = "sensor"
summary = "Closes the control circuit; a click toggles it."

# The movable bar is drawn by the renderer, open or closed: a contact is the second moving
# part of the catalog after the piston, and its state belongs to the run (ADR 0018).
kinematics = "contact"

[[port]]
id = "1"
role = "electrical"
position = [0.0, 0.5]

[[port]]
id = "2"
role = "electrical"
position = [1.0, 0.5]

[behaviour]
type = "contact"

# The two terminals, with the gap the button closes.
[[symbol]]
kind = "line"
points = [0.0, 0.5, 0.30, 0.5]
line_class = "electrical"

[[symbol]]
kind = "line"
points = [0.70, 0.5, 1.0, 0.5]
line_class = "electrical"

# The push rod and its cap. The bar is the moving part and the renderer draws it: above the
# gap when the contact is open, across it when it is closed.
[[symbol]]
kind = "line"
points = [0.5, 0.32, 0.5, 0.18]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.40, 0.18, 0.60, 0.18]
line_class = "working"
