#
# Selector: a maintained contact with a knob instead of a lever.
#
# A contact of the control circuit. The click is the gesture: a maintained switch keeps the
# state it was left in, and a normally-closed one starts closed. The state is the run's, not
# the document's (ADR 0018).
#
# The symbol is the contact with a round knob over the gap, so a selector reads differently from a lever at palette size.

schema = 3
id = "electrical.switch.selector"
name = "Selector switch"
name_es = "Selector"
category = "sensor"
summary = "A maintained contact with a selector knob."
kinematics = "contact"

[[port]]
id = "1"
role = "electrical"
position = [0.0, 0.5]

[[port]]
id = "2"
role = "electrical"
position = [1.0, 0.5]

[behaviour]
type = "contact"
normally_closed = false

# The two terminals and the gap the bar closes.
[[symbol]]
kind = "line"
points = [0.0, 0.5, 0.30, 0.5]
line_class = "electrical"

[[symbol]]
kind = "line"
points = [0.70, 0.5, 1.0, 0.5]
line_class = "electrical"

# The actuator above the gap. The bar is drawn by the renderer from the run state.
[[symbol]]
kind = "line"
points = [0.5, 0.32, 0.60, 0.16]
line_class = "working"

[[symbol]]
kind = "circle"
points = [0.62, 0.14, 0.05]
line_class = "working"