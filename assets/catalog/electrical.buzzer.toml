#
# Buzzer: one terminal, sounding while the control net feeds it.
#
# The audible twin of the indicator lamp: a load of the boolean net, not a source. Its state
# is drawn as the word `sonando` or `en silencio`, and the window loops a generated sample
# while the state is active (ADR 0022).
#
# The symbol is drawn from the general convention for an audible indicator: a round body
# with two sound waves opening to the right and a stem to its terminal.

schema = 3
id = "electrical.buzzer"
name = "Buzzer"
name_es = "Zumbador"
category = "sensor"
summary = "Sounds while its terminal is live."

[[port]]
id = "1"
role = "electrical"
position = [0.0, 0.5]

[behaviour]
type = "buzzer"

# The stem from the terminal to the baseline.
[[symbol]]
kind = "line"
points = [0.0, 0.5, 0.30, 0.5]
line_class = "electrical"

# The IEC acoustic device: a semicircle on a baseline with the outward arrow that says
# sound leaves the part. It is not a circle with decorative waves.
[[symbol]]
kind = "line"
points = [0.30, 0.5, 0.70, 0.5]
line_class = "working"

[[symbol]]
kind = "arc"
points = [0.5, 0.5, 0.18, 180.0, 360.0]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.5, 0.30, 0.5, 0.10]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.46, 0.16, 0.5, 0.10]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.5, 0.10, 0.54, 0.16]
line_class = "working"
