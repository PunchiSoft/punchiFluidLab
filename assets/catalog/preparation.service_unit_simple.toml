#
# Service unit, simplified: the compact form a schematic uses when the unit is not the point.
#
# X12160 gives both representations: the detailed one above, with the three functions drawn
# side by side, and the simplified one below, a single body. The simplified body keeps only
# the marks that say what the unit does: the dashed line at the left is the filter element,
# the circle with the arrow is the regulator's gauge, and the short line on the top edge at
# the right is the mark the standard carries for the lubricator. It has no drain: the drain
# belongs to the filter, and this form does not draw the filter as a separate part.
#
# The two are the same device at two levels of detail; this one is for the circuit that uses
# the unit, and a plain rectangle is not this symbol.

schema = 3
id = "preparation.service_unit_simple"
name = "Service unit, simplified"
name_es = "Unidad de mantenimiento simplificada"
category = "accessory"
summary = "The compact form of the service unit."

[[port]]
id = "1"
role = "supply"
position = [0.06, 0.5]

[[port]]
id = "2"
role = "working"
position = [0.94, 0.5]

[behaviour]
type = "throttle"
conductance = 5.0e-9

[[symbol]]
kind = "rect"
points = [0.14, 0.34, 0.72, 0.32]

# The filter element.
[[symbol]]
kind = "line"
points = [0.28, 0.34, 0.28, 0.66]
line_class = "drain"

# The regulator's gauge, inside the body, with the needle as an arrow from its centre.
[[symbol]]
kind = "circle"
points = [0.60, 0.50, 0.115]

[[symbol]]
kind = "line"
points = [0.60, 0.50, 0.5553, 0.4553]
line_class = "working"

[[symbol]]
kind = "polygon"
points = [0.5269, 0.4269, 0.5694, 0.4412, 0.5412, 0.4694]
filled = true

# The lubricator's mark on the top edge, at the right.
[[symbol]]
kind = "line"
points = [0.80, 0.34, 0.80, 0.42]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.06, 0.5, 0.14, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.86, 0.5, 0.94, 0.5]
line_class = "working"
