#
# Limit switch at the retracted end of a cylinder.
#
# The roller follows a cylinder end: the contact closes when the rod reaches home
# (ADR 0023). The cylinder is chosen in the inspector and stored as the placement source,
# so the file only says which end it watches.
#
# The symbol is a two-terminal contact with a roller lever on top; the renderer draws the
# moving bar from the switch state.

schema = 3
id = "electrical.limit_switch.retracted"
name = "Limit switch, retracted end"
name_es = "Final de carrera, extremo recogido"
category = "sensor"
summary = "Closes when the chosen cylinder is fully home."
kinematics = "contact"

[[port]]
id = "1"
role = "electrical"
position = [0.0, 0.5]

[[port]]
id = "2"
role = "electrical"
position = [1.0, 0.5]

[behaviour]
type = "limit_switch"
end = "retracted"

# The two terminals and the gap the bar closes.
[[symbol]]
kind = "line"
points = [0.0, 0.5, 0.30, 0.5]
line_class = "electrical"

[[symbol]]
kind = "line"
points = [0.70, 0.5, 1.0, 0.5]
line_class = "electrical"

# The roller lever, mirrored so the two ends read differently at palette size.
[[symbol]]
kind = "line"
points = [0.54, 0.32, 0.42, 0.16]
line_class = "working"

[[symbol]]
kind = "circle"
points = [0.40, 0.14, 0.05]
line_class = "working"
