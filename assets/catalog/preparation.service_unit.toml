#
# Service unit: filter, regulator and lubricator in one body.
#
# The air a compressor delivers is wet and its pressure wanders, so it is not what a
# cylinder can use. The service unit is the block that makes it usable, and it sits between
# the compressor and the first valve, never after it: what comes out of the unit is the
# line pressure the rest of the circuit is designed around.
#
# X12160 draws the three functions in the order the air meets them, inside a frame that says
# they are one unit:
#
# - the **filter** with manual drain: the diamond with the element, the bowl chord and the
#   drain stem leaving the bottom vertex;
# - the **pressure-relieving regulator**: an upright square with the flow through it and the
#   two facing arrows inside, the spring above with the diagonal arrow that says the setting
#   is adjustable, the vent triangle on its left and the dashed sensing line from the outlet
#   back to its underside;
# - the **gauge**, a circle on a stem that taps the line after the regulator, with an arrow
#   from its centre for the needle;
# - the **lubricator**: the diamond with the plain line from its top vertex.
#
# The ports sit on the frame's left and right edges: the 20 mm box leaves the 1.2 mm margin
# the numerals need only inside the frame, so the frame is also the symbol's envelope and the
# hose arrives at the unit's edge.

schema = 3
id = "preparation.service_unit"
name = "Service unit (FRL)"
name_es = "Unidad de mantenimiento (FRL)"
category = "accessory"
summary = "Filters, regulates and lubricates the air before it enters the circuit."

# The functional outer boundary: the two opposite corners of the frame below. The ports sit
# on its left and right edges, so the renderer reads the frame as the edge a numeral must
# stay clear of.
envelope = [0.06, 0.12, 0.94, 0.88]

[[port]]
id = "1"
role = "supply"
position = [0.06, 0.5]

[[port]]
id = "2"
role = "working"
position = [0.94, 0.5]

# A service unit drops a little pressure and nothing else: the conductance is high on
# purpose, so the model does not pretend the unit is a restriction the designer chose.
[behaviour]
type = "throttle"
conductance = 5.0e-9

# The working line, in the pieces between the parts it joins. It runs through the regulator's
# square because that is the flow the two facing arrows mark; it stops at the filter's and the
# lubricator's vertices, because inside a diamond the element or the oil mark is the symbol.
[[symbol]]
kind = "line"
points = [0.06, 0.5, 0.10, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.34, 0.5, 0.37, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.37, 0.5, 0.55, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.55, 0.5, 0.68, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.86, 0.5, 0.94, 0.5]
line_class = "working"

# The frame: the functions are one body.
[[symbol]]
kind = "polyline"
points = [0.06, 0.12, 0.94, 0.12, 0.94, 0.88, 0.06, 0.88, 0.06, 0.12]
line_class = "drain"

# The filter: a square turned 45°, its element dashed down to the bowl chord.
[[symbol]]
kind = "polygon"
points = [0.22, 0.38, 0.34, 0.5, 0.22, 0.62, 0.10, 0.5]
filled = false

[[symbol]]
kind = "line"
points = [0.22, 0.38, 0.22, 0.5775]
line_class = "drain"

[[symbol]]
kind = "line"
points = [0.1875, 0.5775, 0.2625, 0.5775]
line_class = "working"

# Its drain stem, crossing the frame on its way out.
[[symbol]]
kind = "line"
points = [0.22, 0.62, 0.22, 0.95]
line_class = "working"

# The regulator: an upright square, flow through it, and the two facing arrows.
[[symbol]]
