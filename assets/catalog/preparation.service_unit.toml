#
# Service unit: filter, regulator and lubricator in one body.
#
# The air a compressor delivers is wet and its pressure wanders, so it is not what a
# cylinder can use. The service unit is the block that makes it usable, and it sits between
# the compressor and the first valve, never after it: what comes out of the unit is the
# line pressure the rest of the circuit is designed around.
#
# X12160 draws the three functions in the order the air meets them, inside a frame that says
# they are one unit. The frame is a chain line (`boundary`), not a drain or a pilot line:
#
# - the **filter** with manual drain: the diamond with the element down to the bowl chord,
#   the chord and the drain stem leaving the bottom vertex;
# - the **pressure-relieving regulator**: an upright square with the flow through it and the
#   two facing arrows inside, the spring above with the diagonal arrow that says the setting
#   is adjustable, the vent triangle on its left and the dashed sensing line from the outlet
#   back to its underside;
# - the **gauge**, a circle on a stem that taps the line after the regulator, with an arrow
#   from its centre for the needle;
# - the **lubricator**: the diamond with the plain line from its top vertex.
#
# The box is 46 × 25 mm, the proportion the owner derived from his reference with a cylinder
# as the scale; the standard draws the unit wider than tall, and a square box compressed it.
# The ports sit outside the frame, on the working line, and the frame is the boundary their
# numerals are read against: `1` above the left stub and `2` below the right one, in the
# margin the box leaves for them (`RF053`).
#
# All coordinates are fractions of the 46 × 25 mm box, so the millimetres in the review are
# the drawing: x_mm = fraction · 46, y_mm = fraction · 25.

schema = 3
id = "preparation.service_unit"
name = "Service unit (FRL)"
name_es = "Unidad de mantenimiento (FRL)"
category = "accessory"
summary = "Filters, regulates and lubricates the air before it enters the circuit."
box = [46, 25]

# The envelope is the whole box: the ports live outside the frame, in its margin, so the
# outer boundary of the symbol is the box and the frame is the chain line below.
envelope = [0.0, 0.0, 1.0, 1.0]

[[port]]
id = "1"
role = "supply"
position = [0.04, 0.5]

[[port]]
id = "2"
role = "working"
position = [0.96, 0.5]

# A service unit drops a little pressure and nothing else: the conductance is high on
# purpose, so the model does not pretend the unit is a restriction the designer chose.
[behaviour]
type = "throttle"
conductance = 5.0e-9

# The working line, in the pieces between the parts it joins. It crosses the frame at the
# two ports, runs through the regulator's square because that is the flow the two facing
# arrows mark, and stops at the filter's and the lubricator's vertices: inside a diamond
# the element or the oil mark is the symbol, not a line through it.
[[symbol]]
kind = "line"
points = [0.04, 0.5, 0.1, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.1, 0.5, 0.136957, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.276087, 0.5, 0.354348, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.354348, 0.5, 0.493478, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.493478, 0.5, 0.652174, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.652174, 0.5, 0.743478, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.865217, 0.5, 0.9, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.9, 0.5, 0.96, 0.5]
line_class = "working"

# The frame: the functions are one body, and the chain line is the assembly boundary.
[[symbol]]
kind = "polyline"
points = [
    0.1, 0.1,
    0.9, 0.1,
    0.9, 0.9,
    0.1, 0.9,
    0.1, 0.1,
]
line_class = "boundary"

# The filter: a square turned 45°, its element dashed down to the bowl chord.
[[symbol]]
