#
# Single-acting cylinder with a return spring, 20 mm bore and 100 mm stroke.
#
# The piston, the rod and the spring are drawn by the renderer, because they
# move: the symbol here holds the barrel, the end cap and the port. The spring
# side is declared so the renderer puts the return spring at the rod side, where
# it belongs. The mechanical values describe a small cylinder loaded with half a
# kilogram.

schema = 3
id = "cylinder.single_acting_20_100"
name = "Single-acting cylinder, 20/100"
name_es = "Cilindro de simple efecto, 20/100"
category = "actuator"
summary = "20 mm bore, 100 mm stroke, return spring."
kinematics = "linear_actuator"

[spring]
side = "right"

# The port of a single-acting cylinder is drilled in the cap end, and it is drawn leaving
# that cap downwards: the cap is the face the air pushes on, and the bottom edge is where a
# reader looks for the connection. The rod end carries no port at all — that is what makes
# it single-acting — so nothing is drawn on that side but the spring and the rod.
[[port]]
id = "1"
role = "working"
position = [0.16, 1.0]

[behaviour]
type = "cylinder"
bore_mm = 20.0
stroke_mm = 100.0
dead_length_mm = 5.0
moving_mass_kg = 0.5
spring_rate = 250.0
spring_preload = 5.0
damping = 2.0
friction = 1.5

# Barrel. The piston, the rod and the return spring are drawn by the renderer
# from `kinematics` and the current extension. The chamber inside this barrel is
# stroke plus dead length, so the piston crosses all of it; the rest of the box is
# the rod, which reaches its edge at full stroke and still shows at rest.
[[symbol]]
kind = "rect"
points = [0.08, 0.28, 0.42, 0.44]

[[symbol]]
kind = "line"
points = [0.16, 0.72, 0.16, 1.0]
line_class = "working"
