#
# Maintained switch: a contact that stays where it is put.
#
# A contact of the control circuit. The click is the gesture: a maintained switch keeps the
# state it was left in, and a normally-closed one starts closed. The state is the run's, not
# the document's (ADR 0018).
#
# The symbol is the contact with a lever cap over the gap; the click toggles it and it stays.

schema = 3
id = "electrical.switch.maintained"
name = "Maintained switch"
name_es = "Interruptor mantenido"
category = "sensor"
summary = "Keeps the state the click left it in."
kinematics = "contact"

[[port]]
id = "1"
role = "electrical"
position = [0.0, 0.5]

[[port]]
id = "2"
role = "electrical"
position = [1.0, 0.5]

[behaviour]
type = "contact"
normally_closed = false

# The two terminals and the gap the bar closes.
[[symbol]]
kind = "line"
points = [0.0, 0.5, 0.30, 0.5]
line_class = "electrical"

[[symbol]]
kind = "line"
points = [0.70, 0.5, 1.0, 0.5]
line_class = "electrical"

# The actuator above the gap. The bar is drawn by the renderer from the run state.
[[symbol]]
kind = "line"
points = [0.5, 0.32, 0.5, 0.18]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.38, 0.18, 0.62, 0.18]
line_class = "working"