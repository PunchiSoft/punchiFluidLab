#
# Filter: takes the solid particles out of the air.
#
# X11980 is a square turned 45° with the flow crossing it from vertex to vertex and the
# element drawn as a dashed line **across** the diamond, perpendicular to the flow. The
# standard draws that figure with the flow vertical and the element horizontal; X12190 draws
# the same diamond with the flow horizontal, so this file uses the horizontal form and the
# element runs from the top vertex to the bottom one.
#
# The working line stops at each vertex and is not drawn through the inside: what is inside
# the diamond is the element, and a line across it would read as two overlapping drawings.

schema = 3
id = "filter.air"
name = "Air filter"
name_es = "Filtro de aire"
category = "accessory"
summary = "Filters the solid particles out of the air."

[[port]]
id = "1"
role = "working"
position = [0.06, 0.5]

[[port]]
id = "2"
role = "working"
position = [0.94, 0.5]

# A filter is a small pressure drop, not a restriction anyone designed: the conductance is
# high on purpose.
[behaviour]
type = "throttle"
conductance = 2.0e-9

[[symbol]]
kind = "polygon"
points = [0.5, 0.28, 0.72, 0.5, 0.5, 0.72, 0.28, 0.5]
filled = false

# The element, across the diamond from vertex to vertex.
[[symbol]]
kind = "line"
points = [0.5, 0.28, 0.5, 0.72]
line_class = "drain"

[[symbol]]
kind = "line"
points = [0.06, 0.5, 0.28, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.72, 0.5, 0.94, 0.5]
line_class = "working"
