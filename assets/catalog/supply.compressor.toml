#
# Compressor: the machine that makes the compressed air, not the air itself.
#
# The circle with the **outline** triangle inside it is the source symbol of ISO 1219-1 for a
# gas; a filled triangle is the hydraulic source, so the fill is a medium and not a style
# choice. The triangle stands on its base line inside the circle, and the delivery leaves the
# bottom through a short stem that ends in the small open circle of a connection point.
#
# A compressor alone is not a usable air line: the air it delivers is wet and its pressure
# wanders. The service unit (`preparation.service_unit`) is what makes it usable.

schema = 3
id = "supply.compressor"
name = "Compressor, 6 bar"
name_es = "Compresor, 6 bar"
category = "supply"
summary = "Makes the compressed air that feeds the circuit."

[[port]]
id = "1"
role = "supply"
position = [0.5, 0.08]

[behaviour]
type = "supply"
pressure_bar = 6.0

[[symbol]]
kind = "circle"
points = [0.5, 0.40, 0.30]

# The same triangle as the network's, apex up: the delivery leaves through the point and
# the stem goes up to the connection.
[[symbol]]
kind = "polygon"
points = [0.5, 0.32, 0.66, 0.66, 0.34, 0.66]
filled = false

[[symbol]]
kind = "line"
points = [0.5, 0.25, 0.5, 0.08]
line_class = "working"

