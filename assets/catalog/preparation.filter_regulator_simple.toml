#
# Filter-regulator, simplified: the compact form a schematic uses when the unit is not the
# point.
#
# X12160's simplified representation of the **filter and regulator only**, with no lubricator:
# a single wide body with the dashed element line at the left, the large gauge with its
# diagonal needle and, because the owner's unit has an automatic drain, the purge arrow in the
# bottom band. The same body **with the lubricator mark on the top edge** is the separate
# `preparation.service_unit_simple`: the mark is the lubricator, and the two are different
# components (owner's 2026-11-25 decision).
#
# The box is 40 × 20 mm (2 : 1), the proportion the owner derived from his reference. The body
# is 32 × 15.2 mm inside it; the ports sit outside the body on the working line, and the body
# is the frame their numerals are read against: `1` above the left stub and `2` below the
# right one. The body is solid, so the frame is declared rather than drawn as a chain line.
#
# All coordinates are fractions of the 40 × 20 mm box: x_mm = fraction · 40, y_mm = fraction ·
# 20.

schema = 3
id = "preparation.filter_regulator_simple"
name = "Filter regulator, simplified"
name_es = "Filtro-regulador simplificado"
category = "accessory"
summary = "The compact filter and regulator, without a lubricator."
box = [40, 20]

# The envelope is the whole box: the ports are outside the body, in its margin.
envelope = [0.0, 0.0, 1.0, 1.0]
# The body is the frame the numerals are placed against; it is a solid rectangle, not a
# chain line, so the frame is a datum and not a primitive's class.
frame = [0.11, 0.12, 0.89, 0.88]

[[port]]
id = "1"
role = "supply"
position = [0.04, 0.5]

[[port]]
id = "2"
role = "working"
position = [0.96, 0.5]

[behaviour]
type = "throttle"
conductance = 5.0e-9

# The body: one rectangle, wider than tall.
[[symbol]]
kind = "rect"
points = [0.11, 0.12, 0.78, 0.76]

# The filter element: a dashed line at the left, full height.
[[symbol]]
kind = "line"
points = [0.22, 0.12, 0.22, 0.88]
line_class = "drain"

# The regulator's gauge, inside the body: the reference's large circle with the needle as a
# full diagonal from the lower-right edge to the upper-left edge, the filled head at the
# upper-left.
[[symbol]]
kind = "circle"
points = [0.52, 0.5, 0.225]

[[symbol]]
kind = "line"
points = [0.5996, 0.6591, 0.4405, 0.3409]
line_class = "working"

[[symbol]]
kind = "polygon"
points = [0.4405, 0.3409, 0.4855, 0.3709, 0.4555, 0.4309]
filled = true

# No lubricator tick: this component is the filter-regulator. The short mark on the top edge
# belongs to the separate `preparation.service_unit_simple`; the two are different components
# (owner's 2026-11-25 decision).

# The automatic drain of the filter: the purge arrow in the bottom band, pointing out.
[[symbol]]
kind = "line"
points = [0.22, 0.88, 0.22, 0.96]
line_class = "working"

[[symbol]]
kind = "polygon"
points = [0.22, 0.96, 0.205, 0.92, 0.235, 0.92]
filled = true

[[symbol]]
kind = "line"
points = [0.04, 0.5, 0.11, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.89, 0.5, 0.96, 0.5]
line_class = "working"
