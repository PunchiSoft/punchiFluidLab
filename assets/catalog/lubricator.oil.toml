#
# Oil lubricator: adds an oil mist to the air so the moving parts are lubricated.
#
# X12240 is the same square turned 45° as the filter, with the flow crossing it from vertex
# to vertex. What tells the two apart is inside the diamond: the lubricator carries a
# **plain line from the top vertex toward the centre** and no element at all, because
# nothing is filtered here; oil is added. The line has no arrowhead: the standard marks the
# oil by the line, and a head would make it read as a flow direction.

schema = 3
id = "lubricator.oil"
name = "Oil lubricator"
name_es = "Unidad de lubricación de aceite"
category = "accessory"
summary = "Adds an oil mist to the air to lubricate the moving parts."

[[port]]
id = "1"
role = "working"
position = [0.06, 0.5]

[[port]]
id = "2"
role = "working"
position = [0.94, 0.5]

[behaviour]
type = "throttle"
conductance = 3.0e-9

[[symbol]]
kind = "polygon"
points = [0.5, 0.28, 0.72, 0.5, 0.5, 0.72, 0.28, 0.5]
filled = false

# The oil mark: the line from the top vertex toward the centre, no head.
[[symbol]]
kind = "line"
points = [0.5, 0.28, 0.5, 0.4]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.06, 0.5, 0.28, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.72, 0.5, 0.94, 0.5]
line_class = "working"
