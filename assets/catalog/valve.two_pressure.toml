#
# Two-pressure valve (AND): the outlet receives only while both inlets carry pressure,
# and then follows the lower of the two.
#
# The two inlets carry the numeral 1 and the outlet the numeral 2, as the standard
# draws them; the ids stay distinct because a pipe, the document and the solver
# address a port by id. The body, the double piston and the outlet path are
# hand-drawn primitives (ADR 0039): the element is a flat symbol, not a position
# valve, so it declares no `body` for the valve drawer.

schema = 3
id = "valve.two_pressure"
name = "Two-pressure valve (AND)"
name_es = "Válvula de dos presiones (AND)"
category = "valve"
summary = "Passes air only while both inlets are pressurised, at the lower of the two."

# The square body and the three stubs to the ports.
[[symbol]]
kind = "rect"
points = [0.25, 0.3, 0.5, 0.4]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.0, 0.5, 0.25, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.75, 0.5, 1.0, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.5, 0.0, 0.5, 0.3]
line_class = "working"

# The through path and the double piston that decides with it.
[[symbol]]
kind = "line"
points = [0.25, 0.5, 0.75, 0.5]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.43, 0.4, 0.43, 0.6]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.57, 0.4, 0.57, 0.6]
line_class = "working"

[[symbol]]
kind = "line"
points = [0.43, 0.5, 0.57, 0.5]
line_class = "working"

# The outlet reaches the piston between its two faces.
[[symbol]]
kind = "line"
points = [0.5, 0.3, 0.5, 0.5]
line_class = "working"

[[port]]
id = "1a"
role = "supply"
position = [0.0, 0.5]
numeral = "1"

[[port]]
id = "1b"
role = "supply"
position = [1.0, 0.5]
numeral = "1"

[[port]]
id = "2"
role = "working"
position = [0.5, 0.0]

[behaviour]
type = "pressure"
kind = "two_pressure"
