# cargo-deny configuration.
#
# The allow list is deliberately explicit: adding a licence here is a decision, not a
# formality. Everything must be compatible with distributing this project under
# GPL-3.0-or-later.

[graph]
targets = []
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `ab_glyph` -> `owned_ttf_parser` -> `ttf-parser`. Unmaintained, not vulnerable: no
    # fixed release exists, and the proposed alternative (skrifa) replaces the whole font
    # stack. Revisit when punchi-fluid-export moves off `ab_glyph`.
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    # Our own crates.
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "OFL-1.1",
    "MPL-2.0",
    "Unlicense",
]
# Fonts and icons read at runtime from the system are not distributed by us.
exceptions = []

[bans]
multiple-versions = "warn"
# Our crates depend on each other through `workspace = true`, which writes a path and no
# version: cargo-deny reads that as a wildcard. Path dependencies are the point of a
# workspace, so they are allowed; a wildcard on a registry crate is still a finding.
allow-wildcard-paths = true
wildcards = "deny"
deny = [
    # A GNU toolchain requirement would break the reproducible build.
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
