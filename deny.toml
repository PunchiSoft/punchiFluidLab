# cargo-deny configuration.
#
# The allow list is deliberately explicit: adding a licence here is a decision, not a
# formality. Everything must be compatible with distributing this project under
# GPL-3.0-or-later.

[graph]
targets = []
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "OFL-1.1",
    "MPL-2.0",
    "Unlicense",
]
# Fonts and icons read at runtime from the system are not distributed by us.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # A GNU toolchain requirement would break the reproducible build.
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
