name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The classifier answers one question: can the Rust and window gate observe this
  # change? A documentation-only pull request runs `check-docs.sh`; anything else runs
  # the full gate. The workflow itself is never skipped by path filtering, because a
  # skipped workflow leaves its required checks "Pending" on a protected branch. A job
  # that runs and is skipped reports success, which is the behaviour the branch
  # protection accepts.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Check out the pull request history
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the change
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The full checkout normally has both commits; a fork with an unusual base
          # still gets the base fetched explicitly before the diff.
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          if ! result=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" | ./scripts-dev/changed-paths.sh --stdin); then
            echo "the changed-path classifier failed" >&2
            exit 1
          fi
          if [[ "$result" == "code" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif [[ "$result" == "docs" ]]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "the changed-path classifier printed '$result'" >&2
            exit 1
          fi

  check:
    name: check
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fail when the change classifier failed
        if: ${{ needs.changes.result != 'success' || (needs.changes.outputs.code != 'true' && needs.changes.outputs.code != 'false') }}
        run: exit 1

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A documentation-only pull request cannot change the Rust graph or the window.
      # It still runs the contracts that read the files it edits: the index and links,
      # the ADR metadata, the crate list against Cargo.toml and the issue labels.
      - name: Documentation contracts
        if: needs.changes.outputs.code != 'true'
        env:
          # Lets `check-docs.sh` verify that a contact link points at something the
          # repository actually has; without it the check only warns.
          GH_TOKEN: ${{ github.token }}
        run: ./scripts-dev/check-docs.sh

      # One pin, in rust-toolchain.toml. Installing "stable" here is how main went red
      # on a lint the machine had never seen: the compiler CI used was newer than the
      # compiler the project was validated with.
      - name: Read the pinned toolchain
        if: needs.changes.outputs.code == 'true'
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install the Rust toolchain
        if: needs.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache the build
        if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run the full gate
        if: needs.changes.outputs.code == 'true'
        env:
          # Lets `check-docs.sh` verify that a contact link points at something the
          # repository actually has; without it the check only warns.
          GH_TOKEN: ${{ github.token }}
        run: ./scripts-dev/check.sh

  window:
    name: window
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `check.sh` skips the window when it has never been configured, which on a fresh
      # runner means always. This job is the gate that cannot skip: the drawing and the
      # gestures live in the window, and the sheet once answered no click with every Rust
      # test green.
      - name: Install Qt and the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build libgl1-mesa-dev \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev \
            qml6-module-qtquick qml6-module-qtquick-window \
            qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-layouts qml6-module-qtquick-dialogs \
            qml6-module-qtmultimedia \
            breeze-icon-theme adwaita-icon-theme

      - name: Read the pinned toolchain
        id: rust
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Configure the window
        run: cmake -S apps/punchi-fluid-qt -B apps/punchi-fluid-qt/build -G Ninja

      - name: Build the window
        run: cmake --build apps/punchi-fluid-qt/build

      - name: Drive the window headlessly
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          app=apps/punchi-fluid-qt/build/punchi-fluid
          "$app" --check-qml
          "$app" --check-theme
          "$app" --check-icons
          "$app" --selftest

  msrv:
    name: minimum supported Rust version
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 1.85 is the floor declared in Cargo.toml, not the toolchain the project is built
      # with day to day. It is an input and not the action's revision on purpose: as a
      # revision it looked like a version to bump, and dependabot proposed 1.120.0.
      - name: Install the declared minimum
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.85.0"

      - name: Cache the build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build with the declared minimum
        run: cargo build --workspace --locked
