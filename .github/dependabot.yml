version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      serialization:
        patterns: ["serde*", "toml", "ron"]
      render:
        patterns: ["tiny-skia", "ab_glyph", "fontdb"]
      dev:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
