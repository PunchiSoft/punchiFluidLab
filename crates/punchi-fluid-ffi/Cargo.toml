[package]
name = "punchi-fluid-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "C ABI over the Rust core, for a native front end"

[lib]
name = "punchi_fluid"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
punchi-fluid-catalog = { workspace = true }
punchi-fluid-check = { workspace = true }
punchi-fluid-doc = { workspace = true }
punchi-fluid-draw = { workspace = true }
punchi-fluid-file = { workspace = true }
punchi-fluid-solver = { workspace = true }

# This crate opts out of the inherited workspace lints on purpose. The workspace sets
# `unsafe_code = "forbid"`, and `forbid` cannot be relaxed by a crate, but a C ABI is
# unsafe by definition: it dereferences caller pointers and is entered with no Rust
# frame above it. The lints are restated here with `deny` so nothing weaker slips in,
# `src/lib.rs` tightens `unsafe_code` to `deny`, and only the test, which has to call
# the unsafe entry points, carries an `allow`.
[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
